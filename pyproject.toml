[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymetaheuristics"
dynamic = ["version"]
description = "Metaheuristics solvers in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# 3.7 and 3.8 are end-of-life
requires-python = ">=3.9"
authors = [{ name = "Igor Souza", email = "igormcsouza@gmail.com" }]
keywords = ["metaheuristics", "python", "solver"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit"]

[project.urls]
Homepage = "https://github.com/igormcsouza/pymetaheuristics"
Repository = "https://github.com/igormcsouza/pymetaheuristics"

[tool.hatch.version]
path = "pymetaheuristics/__init__.py"

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
